name: Tests

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.rst'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python: ["3.11"]
        plone: ["60"]
        tz: ["UTC", "Europe/Rome"]
    steps:
      - uses: actions/checkout@v4
      - name: Cache eggs
        uses: actions/cache@v4
        with:
          path: eggs
          key: ${{ runner.OS }}-build-python${{ matrix.python }}-${{ matrix.plone }}
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -c constraints_plone${{ matrix.plone }}.txt
          cp test_plone${{ matrix.plone }}.cfg buildout.cfg
      - name: Install buildout
        run: |
          buildout -N code-analysis:return-status-codes=True
      - name: Start Solr
        run: |
          # solr runs as uid 8983 in the container and needs to write the core data dirs
          chmod -R a+rwX config
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf "http://localhost:8983/solr/solrpush_test/admin/ping?wt=json" | grep -q '"status":"OK"' && exit 0
            sleep 2
          done
          docker compose logs solr
          exit 1
      - name: Code analysis
        run: |
          bin/code-analysis
      - name: Run tests
        run: |
          bin/test-coverage
        env:
          PROXY_BEARER_AUTH: on
          TZ: ${{ matrix.tz }}
      - name: Upload coverage data to coveralls.io
        run: |
          pip install coveralls
          coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: py${{ matrix.python }}-plone${{ matrix.plone }}-tz${{ matrix.tz }}
          COVERALLS_PARALLEL: true

  coveralls_finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Finished
      run: |
        pip install --upgrade coveralls
        coveralls --service=github --finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
