name: Tests

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.rst'
env:
  BUILDOUT_SOLR_ENVIRONMENT: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python: ["3.11"]
        plone: ["60"]
        tz: ["UTC", "Europe/Rome"]
    steps:
      - uses: actions/checkout@v4
      - name: Cache eggs
        uses: actions/cache@v4
        with:
          path: eggs
          key: ${{ runner.OS }}-build-python${{ matrix.python }}-${{ matrix.plone }}
      - name: Restore downloads cache (solr tarball)
        id: downloads-cache
        uses: actions/cache/restore@v4
        with:
          path: downloads
          key: ${{ runner.OS }}-downloads-${{ hashFiles('base.cfg') }}
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # solr 7.7 does not start on recent java versions (CMS GC removed in java 14)
      - name: Set up Java 11 (for solr)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -c constraints_plone${{ matrix.plone }}.txt
          cp test_plone${{ matrix.plone }}.cfg buildout.cfg
      - name: Install buildout
        run: |
          mkdir -p downloads
          buildout -N code-analysis:return-status-codes=True buildout:download-cache=downloads
      # saved right after buildout, so it is kept even if tests fail
      - name: Save downloads cache (solr tarball)
        if: steps.downloads-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: downloads
          key: ${{ runner.OS }}-downloads-${{ hashFiles('base.cfg') }}
      - name: Code analysis
        run: |
          bin/code-analysis
      - name: Run tests
        run: |
          bin/test-coverage
        env:
          PROXY_BEARER_AUTH: on
          TZ: ${{ matrix.tz }}
      - name: Upload coverage data to coveralls.io
        run: |
          pip install coveralls
          coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: py${{ matrix.python }}-plone${{ matrix.plone }}-tz${{ matrix.tz }}
          COVERALLS_PARALLEL: true

  coveralls_finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Finished
      run: |
        pip install --upgrade coveralls
        coveralls --service=github --finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
