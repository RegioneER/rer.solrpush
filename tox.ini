[tox]
# tox-uv uses uv for virtualenv creation and Python management.
# Install it with: pip install tox-uv  or  uv tool install tox --with tox-uv
requires =
    tox-uv >= 1.0
envlist =
    black
    flake8
    zpretty
    pyroma

[testenv:black]
description = Check code formatting with black
base_python = python3.11
skip_install = true
deps = black
commands =
    black src/ --check --diff

[testenv:black-apply]
description = Auto-format code with black
base_python = python3.11
skip_install = true
deps = black
commands =
    black src/

[testenv:flake8]
description = Lint with flake8
base_python = python3.11
skip_install = true
deps = flake8
commands =
    flake8 src/ setup.py

[testenv:zpretty]
description = Check ZCML formatting with zpretty
base_python = python3.11
skip_install = true
deps = zpretty
allowlist_externals = bash
commands =
    bash -c "find src -name '*.zcml' | xargs zpretty --check"

[testenv:zpretty-apply]
description = Auto-format ZCML files with zpretty
base_python = python3.11
skip_install = true
deps = zpretty
allowlist_externals = bash
commands =
    bash -c "find src -name '*.zcml' | xargs zpretty -i"

[testenv:pyroma]
description = Check package metadata quality with pyroma
base_python = python3.11
skip_install = true
deps = pyroma
commands =
    pyroma -n 10 -d .
